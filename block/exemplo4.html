<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display None</title>
    <style>
        p {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Exemplo 4</h1>
    <h1>Este é um exemplo de como usar a propriedade display:none.</h1>
    <p>Este parágrafo não será exibido.</p>
</body>
</html>
