<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href=".vscode/style01.css">
</head>
<body>
    <h1>Relatório de Desempenho de Turma 2026</h1>
    <h2>Notas dos alunos por disciplina</h2>
    <p>A tabela abaixo apresenta as notas dos alunos nas disciplinas de Matemática e Português.</p>

    <table>
        <tr>
            <th colspan="4">Lista de participantes do Evento</th>
        </tr>
        <tr>
            <th>Turno</th>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>

        <tr>
            <td rowspan="2">Manha</td>
            <td>Ana</td>
            <td>22</td>
            <td>Recife</td>
        </tr>
        <tr>
            <td>Bruno</td>
            <td>24</td>
            <td>Olinda</td>
        </tr>
        <tr>
            <td rowspan="2">Tarde</td>
            <td>Carla</td>
            <td>23</td>
            <td>Jaboatão</td>
</body>
</html>
